<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background (dusk sky) -->
  <rect width="400" height="300" fill="#F7F2ED"/>
  <!-- Gradient sky hint -->
  <rect x="0" y="0" width="400" height="160" fill="#EDE5DA" opacity="0.6"/>

  <!-- Hanok silhouette (background) -->
  <rect x="60" y="155" width="280" height="100" fill="#6B5344" opacity="0.15"/>
  <polygon points="50,155 200,90 350,155" fill="#8B6E5A" opacity="0.25"/>
  <polygon points="70,155 200,98 330,155" fill="#6B5344" opacity="0.2"/>

  <!-- Hanok walls -->
  <rect x="80" y="155" width="240" height="100" fill="#D4B896" opacity="0.3"/>

  <!-- String of lanterns (main feature) -->
  <!-- String lines -->
  <path d="M60 120 Q200 100 340 120" stroke="#6B5344" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M80 140 Q200 118 320 140" stroke="#6B5344" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Lanterns on first string -->
  <!-- Lantern 1 -->
  <line x1="100" y1="120" x2="100" y2="128" stroke="#6B5344" stroke-width="1"/>
  <rect x="92" y="128" width="16" height="22" rx="3" fill="#C65D28"/>
  <rect x="94" y="128" width="12" height="22" rx="2" fill="#D4774A" opacity="0.5"/>
  <rect x="90" y="126" width="20" height="4" rx="1" fill="#6B5344"/>
  <rect x="90" y="148" width="20" height="4" rx="1" fill="#6B5344"/>
  <line x1="99" y1="152" x2="97" y2="160" stroke="#C65D28" stroke-width="1.2"/>
  <line x1="100" y1="152" x2="100" y2="161" stroke="#C65D28" stroke-width="1.2"/>
  <line x1="101" y1="152" x2="103" y2="160" stroke="#C65D28" stroke-width="1.2"/>

  <!-- Lantern 2 (gold) -->
  <line x1="158" y1="113" x2="158" y2="121" stroke="#6B5344" stroke-width="1"/>
  <rect x="150" y="121" width="16" height="22" rx="3" fill="#B8956A"/>
  <rect x="152" y="121" width="12" height="22" rx="2" fill="#D4B896" opacity="0.5"/>
  <rect x="148" y="119" width="20" height="4" rx="1" fill="#6B5344"/>
  <rect x="148" y="141" width="20" height="4" rx="1" fill="#6B5344"/>
  <line x1="157" y1="145" x2="155" y2="153" stroke="#B8956A" stroke-width="1.2"/>
  <line x1="158" y1="145" x2="158" y2="154" stroke="#B8956A" stroke-width="1.2"/>
  <line x1="159" y1="145" x2="161" y2="153" stroke="#B8956A" stroke-width="1.2"/>

  <!-- Lantern 3 (large, center) -->
  <line x1="200" y1="100" x2="200" y2="110" stroke="#6B5344" stroke-width="1.5"/>
  <rect x="188" y="110" width="24" height="32" rx="4" fill="#C65D28"/>
  <rect x="191" y="110" width="18" height="32" rx="3" fill="#E07040" opacity="0.5"/>
  <rect x="186" y="107" width="28" height="5" rx="1.5" fill="#6B5344"/>
  <rect x="186" y="140" width="28" height="5" rx="1.5" fill="#6B5344"/>
  <line x1="198" y1="145" x2="196" y2="155" stroke="#C65D28" stroke-width="1.5"/>
  <line x1="200" y1="145" x2="200" y2="156" stroke="#C65D28" stroke-width="1.5"/>
  <line x1="202" y1="145" x2="204" y2="155" stroke="#C65D28" stroke-width="1.5"/>

  <!-- Lantern 4 (gold) -->
  <line x1="242" y1="113" x2="242" y2="121" stroke="#6B5344" stroke-width="1"/>
  <rect x="234" y="121" width="16" height="22" rx="3" fill="#B8956A"/>
  <rect x="236" y="121" width="12" height="22" rx="2" fill="#D4B896" opacity="0.5"/>
  <rect x="232" y="119" width="20" height="4" rx="1" fill="#6B5344"/>
  <rect x="232" y="141" width="20" height="4" rx="1" fill="#6B5344"/>
  <line x1="241" y1="145" x2="239" y2="153" stroke="#B8956A" stroke-width="1.2"/>
  <line x1="242" y1="145" x2="242" y2="154" stroke="#B8956A" stroke-width="1.2"/>
  <line x1="243" y1="145" x2="245" y2="153" stroke="#B8956A" stroke-width="1.2"/>

  <!-- Lantern 5 -->
  <line x1="300" y1="120" x2="300" y2="128" stroke="#6B5344" stroke-width="1"/>
  <rect x="292" y="128" width="16" height="22" rx="3" fill="#C65D28"/>
  <rect x="294" y="128" width="12" height="22" rx="2" fill="#D4774A" opacity="0.5"/>
  <rect x="290" y="126" width="20" height="4" rx="1" fill="#6B5344"/>
  <rect x="290" y="148" width="20" height="4" rx="1" fill="#6B5344"/>
  <line x1="299" y1="152" x2="297" y2="160" stroke="#C65D28" stroke-width="1.2"/>
  <line x1="300" y1="152" x2="300" y2="161" stroke="#C65D28" stroke-width="1.2"/>
  <line x1="301" y1="152" x2="303" y2="160" stroke="#C65D28" stroke-width="1.2"/>

  <!-- Second row lanterns (smaller) -->
  <line x1="130" y1="140" x2="130" y2="146" stroke="#6B5344" stroke-width="1"/>
  <rect x="123" y="146" width="14" height="18" rx="3" fill="#8B6E5A"/>
  <rect x="125" y="146" width="10" height="18" rx="2" fill="#A07860" opacity="0.5"/>
  <rect x="121" y="144" width="18" height="4" rx="1" fill="#6B5344"/>
  <rect x="121" y="162" width="18" height="4" rx="1" fill="#6B5344"/>

  <line x1="270" y1="140" x2="270" y2="146" stroke="#6B5344" stroke-width="1"/>
  <rect x="263" y="146" width="14" height="18" rx="3" fill="#8B6E5A"/>
  <rect x="265" y="146" width="10" height="18" rx="2" fill="#A07860" opacity="0.5"/>
  <rect x="261" y="144" width="18" height="4" rx="1" fill="#6B5344"/>
  <rect x="261" y="162" width="18" height="4" rx="1" fill="#6B5344"/>

  <!-- Traditional pattern decorations (scattered) -->
  <!-- Small flowers/rosettes -->
  <circle cx="80" cy="80" r="6" fill="#C65D28" opacity="0.3"/>
  <circle cx="80" cy="80" r="3" fill="#C65D28" opacity="0.5"/>
  <circle cx="320" cy="80" r="6" fill="#B8956A" opacity="0.3"/>
  <circle cx="320" cy="80" r="3" fill="#B8956A" opacity="0.5"/>

  <!-- Ground elements -->
  <rect x="50" y="255" width="300" height="3" rx="1.5" fill="#8B6E5A" opacity="0.3"/>
  <!-- Crowd silhouette (simple) -->
  <ellipse cx="130" cy="257" rx="20" ry="8" fill="#6B5344" opacity="0.2"/>
  <ellipse cx="200" cy="257" rx="25" ry="8" fill="#6B5344" opacity="0.2"/>
  <ellipse cx="270" cy="257" rx="20" ry="8" fill="#6B5344" opacity="0.2"/>
</svg>
