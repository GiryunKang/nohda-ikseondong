<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#F7F2ED"/>

  <!-- Hanok roof (background) -->
  <polygon points="60,120 200,50 340,120" fill="#6B5344"/>
  <polygon points="75,120 200,58 325,120" fill="#8B6E5A"/>
  <rect x="75" y="118" width="250" height="8" fill="#6B5344"/>

  <!-- Hanok wall columns -->
  <rect x="90" y="126" width="14" height="70" fill="#8B6E5A"/>
  <rect x="296" y="126" width="14" height="70" fill="#8B6E5A"/>

  <!-- Hanok wall -->
  <rect x="104" y="126" width="192" height="70" fill="#D4A47A" opacity="0.4"/>

  <!-- Sliding door panels -->
  <rect x="110" y="132" width="50" height="58" rx="1" fill="#F7F2ED" stroke="#8B6E5A" stroke-width="1.5"/>
  <line x1="135" y1="132" x2="135" y2="190" stroke="#8B6E5A" stroke-width="1"/>
  <line x1="110" y1="161" x2="160" y2="161" stroke="#8B6E5A" stroke-width="1"/>
  <rect x="170" y="132" width="60" height="58" rx="1" fill="#F7F2ED" stroke="#8B6E5A" stroke-width="1.5"/>
  <line x1="200" y1="132" x2="200" y2="190" stroke="#8B6E5A" stroke-width="1"/>
  <line x1="170" y1="161" x2="230" y2="161" stroke="#8B6E5A" stroke-width="1"/>
  <rect x="240" y="132" width="50" height="58" rx="1" fill="#F7F2ED" stroke="#8B6E5A" stroke-width="1.5"/>
  <line x1="265" y1="132" x2="265" y2="190" stroke="#8B6E5A" stroke-width="1"/>
  <line x1="240" y1="161" x2="290" y2="161" stroke="#8B6E5A" stroke-width="1"/>

  <!-- Ground line -->
  <rect x="60" y="196" width="280" height="3" rx="1.5" fill="#6B5344" opacity="0.4"/>

  <!-- Wooden table -->
  <rect x="120" y="218" width="160" height="10" rx="3" fill="#8B6E5A"/>
  <rect x="132" y="226" width="8" height="30" rx="2" fill="#6B5344"/>
  <rect x="260" y="226" width="8" height="30" rx="2" fill="#6B5344"/>

  <!-- Bowl (center) -->
  <ellipse cx="200" cy="218" rx="28" ry="8" fill="#C65D28"/>
  <ellipse cx="200" cy="214" rx="28" ry="8" fill="#D4774A"/>
  <ellipse cx="200" cy="214" rx="22" ry="5" fill="#B8956A" opacity="0.6"/>

  <!-- Steam lines -->
  <path d="M190 206 Q187 200 190 194 Q193 188 190 182" stroke="#C65D28" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M200 204 Q197 198 200 192 Q203 186 200 180" stroke="#C65D28" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M210 206 Q213 200 210 194 Q207 188 210 182" stroke="#C65D28" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Chopsticks -->
  <line x1="238" y1="205" x2="248" y2="225" stroke="#6B5344" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="244" y1="204" x2="252" y2="224" stroke="#6B5344" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Side dish small bowls -->
  <ellipse cx="150" cy="220" rx="14" ry="5" fill="#B8956A"/>
  <ellipse cx="150" cy="218" rx="14" ry="5" fill="#C9A87A"/>
  <ellipse cx="250" cy="220" rx="14" ry="5" fill="#B8956A"/>
  <ellipse cx="250" cy="218" rx="14" ry="5" fill="#C9A87A"/>

  <!-- Lantern hanging -->
  <line x1="200" y1="50" x2="200" y2="70" stroke="#6B5344" stroke-width="1.5"/>
  <rect x="191" y="70" width="18" height="24" rx="3" fill="#C65D28"/>
  <rect x="193" y="70" width="14" height="24" rx="2" fill="#D4774A" opacity="0.5"/>
  <rect x="189" y="68" width="22" height="4" rx="1" fill="#6B5344"/>
  <rect x="189" y="92" width="22" height="4" rx="1" fill="#6B5344"/>
  <line x1="197" y1="96" x2="197" y2="102" stroke="#C65D28" stroke-width="1.5"/>
  <line x1="200" y1="96" x2="200" y2="103" stroke="#C65D28" stroke-width="1.5"/>
  <line x1="203" y1="96" x2="203" y2="102" stroke="#C65D28" stroke-width="1.5"/>
</svg>
